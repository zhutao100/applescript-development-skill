name: AppleScript CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Policy scan
        if: ${{ hashFiles('scripts/policy_scan.sh') != '' }}
        run: ./scripts/policy_scan.sh --src ./src

      - name: Compile
        run: ./scripts/compile.sh

      - name: Unit tests (golden output)
        run: ./scripts/test_unit.sh
